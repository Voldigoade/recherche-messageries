name: Documentation et GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les outils de vérification
        run: npm ci
      - name: Vérifier les sources et les règles de décision
        run: |
          python scripts/check_catalog.py
          npm test
      - name: Contrôler le générateur sans remplacer les pages
        run: python scripts/check_generated.py
      - name: Construire la documentation
        run: python -m mkdocs build --strict
      - name: Vérifier les liens, ancres et métadonnées
        run: python scripts/check_site.py
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier le site dans le navigateur
        run: npm run test:browser
      - name: Conserver le diagnostic navigateur en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: .qa/
      - name: Configurer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Préparer le site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
