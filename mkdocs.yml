site_name: Étude des messageries
site_description: Recherche indépendante sur la sécurité, la vie privée et le pseudonymat des messageries.
site_url: https://voldigoade.github.io/recherche-messageries/
repo_url: https://github.com/Voldigoade/recherche-messageries
repo_name: Dépôt GitHub
edit_uri: edit/main/docs/
copyright: Recherche indépendante · Rapport 1.0 · 14 octobre 2026 · CC BY-SA 4.0
theme:
  name: material
  custom_dir: overrides
  language: fr
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.path
  - navigation.footer
  - search.highlight
  - content.action.edit
plugins:
- search:
    lang:
    - fr
    - en
markdown_extensions:
- admonition
- attr_list
- tables
- footnotes
- toc:
    permalink: true
    permalink_title: Lien vers cette section
    toc_depth: 3
- pymdownx.superfences
extra_css:
- stylesheets/documentation.css
extra_javascript:
- javascripts/tables.js
hooks:
- scripts/site_hooks.py
extra:
  generator: false
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
